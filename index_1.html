<style>
:root{
  --bg:#EEF1E9;
  --surface:#FFFFFF;
  --surface-alt:#F6F7F1;
  --ink:#1B241D;
  --ink-soft:#657266;
  --line:#DEE4D6;
  --primary:#2F5233;
  --primary-soft:#E3EBDD;
  --danger:#B3453A;
  --s1:#8C6239; --s2:#A9824F; --s3:#7C9463; --s4:#3F6B4A; --s5:#C9A227; --s6:#CB7C4A; --s7:#C1503C;
}
*{ box-sizing:border-box; }
.bm-root{
  font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  display:flex; justify-content:center;
  min-height:100dvh;
  background:var(--bg);
}
.bm-phone{
  width:100%; max-width:430px;
  min-height:100dvh;
  background:var(--bg);
  display:flex; flex-direction:column;
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,0.06);
}
.bm-content{
  flex:1; overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top)) 18px 96px;
}

.bm-view{ display:flex; flex-direction:column; gap:22px; }

.bm-header h1{ margin:2px 0 14px; font-size:1.5rem; font-weight:700; letter-spacing:-0.01em; }
.bm-header.slim h1{ margin-bottom:4px; }
.bm-eyebrow{ margin:0; font-size:0.85rem; color:var(--ink-soft); font-weight:500; }
.bm-sub{ margin:0 0 6px; font-size:0.85rem; color:var(--ink-soft); }

.bm-header-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.bm-export-btn{
  display:flex; align-items:center; gap:5px; flex-shrink:0;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:7px 10px; font-size:0.72rem; font-weight:600;
  cursor:pointer; margin-top:2px;
}
.bm-export-btn:disabled{ color:var(--ink-soft); cursor:not-allowed; }

.bm-summary-row{ display:flex; gap:10px; flex-wrap:wrap; }
.bm-summary-chip{
  flex:1; min-width:86px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  display:flex; flex-direction:column; gap:2px;
}
.bm-summary-num{ font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
.bm-summary-label{ font-size:0.72rem; color:var(--ink-soft); }

.bm-cta{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; border:none; cursor:pointer;
  background:var(--primary); color:white;
  padding:15px; border-radius:16px;
  font-size:1rem; font-weight:600;
  box-shadow:0 8px 20px rgba(47,82,51,0.28);
}
.bm-cta:active{ transform:translateY(1px); }
.bm-cta-icon{ font-size:1.2rem; line-height:1; }

.bm-section h2{ margin:0 0 10px; font-size:0.92rem; font-weight:700; color:var(--ink); }

.bm-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.bm-entry{
  display:flex; gap:12px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:12px;
}
.bm-entry-icon{
  width:40px; height:40px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.bm-entry-body{ flex:1; min-width:0; }
.bm-entry-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.bm-entry-time{ font-weight:700; font-size:0.9rem; font-variant-numeric:tabular-nums; }
.bm-entry-tag{ font-size:0.72rem; font-weight:600; }
.bm-entry-title{ margin:3px 0 0; font-size:0.85rem; color:var(--ink); }
.bm-entry-note{ margin:4px 0 0; font-size:0.78rem; color:var(--ink-soft); }
.bm-entry-del{
  border:none; background:none; cursor:pointer; color:var(--ink-soft);
  padding:4px; flex-shrink:0;
}
.bm-entry-del:hover{ color:var(--danger); }

.bm-empty{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:34px 20px; color:var(--ink-soft);
  background:var(--surface-alt); border-radius:16px;
  text-align:center; font-size:0.85rem;
}
.bm-empty svg{ color:var(--primary); opacity:0.5; }

.bm-save-error{
  margin-top:14px; padding:10px 12px; border-radius:10px;
  background:#FBEAE7; color:var(--danger); font-size:0.8rem;
}

.bm-fab{
  position:absolute; right:18px; bottom:88px;
  width:54px; height:54px; border-radius:50%;
  background:var(--primary); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 22px rgba(47,82,51,0.35);
}

.bm-tabbar{
  position:sticky; bottom:0;
  display:flex; background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.bm-tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  border:none; background:none; cursor:pointer;
  padding:6px 0; color:var(--ink-soft); font-size:0.7rem;
}
.bm-tab.active{ color:var(--primary); font-weight:600; }

.bm-bar-chart{ display:flex; gap:8px; align-items:flex-end; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 14px 12px; height:150px; }
.bm-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; gap:4px; }
.bm-bar-track{ flex:1; width:100%; display:flex; align-items:flex-end; }
.bm-bar-fill{ width:100%; background:var(--primary); border-radius:6px 6px 3px 3px; min-height:6px; }
.bm-bar-count{ font-size:0.72rem; font-weight:700; }
.bm-bar-label{ font-size:0.68rem; color:var(--ink-soft); }

.bm-dist{ display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; }
.bm-dist-row{ display:flex; align-items:center; gap:10px; }
.bm-dist-icon{ flex-shrink:0; width:20px; }
.bm-dist-bar-track{ flex:1; height:8px; border-radius:4px; background:var(--surface-alt); overflow:hidden; }
.bm-dist-bar-fill{ height:100%; border-radius:4px; }
.bm-dist-pct{ font-size:0.75rem; font-weight:600; width:34px; text-align:right; color:var(--ink-soft); }

.bm-overlay{
  position:fixed; inset:0; background:rgba(20,26,20,0.45);
  display:flex; align-items:flex-end; justify-content:center;
  z-index:50;
}
.bm-sheet{
  width:100%; max-width:430px; max-height:88dvh; overflow-y:auto;
  background:var(--bg); border-radius:22px 22px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  animation:bm-slide-up 0.24s ease-out;
}
@keyframes bm-slide-up{ from{ transform:translateY(24px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
.bm-sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 14px; }
.bm-sheet-title{ margin:0 0 16px; font-size:1.15rem; font-weight:700; }

.bm-field-label{ font-size:0.78rem; color:var(--ink-soft); font-weight:600; margin:0 0 6px; display:block; }

.bm-type-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.bm-type-card{
  display:flex; flex-direction:column; align-items:flex-start; gap:3px;
  text-align:left; border-radius:14px; border:1.5px solid var(--line);
  background:var(--surface); padding:10px; cursor:pointer;
}
.bm-type-card.selected{ border-color:var(--type-color); background:color-mix(in srgb, var(--type-color) 10%, white); }
.bm-type-num{ font-size:0.68rem; color:var(--ink-soft); font-weight:600; }
.bm-type-title{ font-size:0.78rem; font-weight:600; line-height:1.25; }
.bm-type-tag{ font-size:0.68rem; font-weight:600; }

.bm-field-row{ display:flex; gap:10px; margin-bottom:14px; }
.bm-field{ flex:1; margin-bottom:14px; }
.bm-field-row .bm-field{ margin-bottom:0; }
.bm-field input{
  width:100%; box-sizing:border-box;
  border:1.5px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:0.9rem; background:var(--surface); color:var(--ink);
  font-family:inherit;
}
.bm-field input:focus{ outline:2px solid var(--primary); outline-offset:1px; }

.bm-sheet-actions{ display:flex; gap:10px; margin-top:4px; }
.bm-btn-secondary, .bm-btn-primary{
  flex:1; padding:13px; border-radius:14px; border:none; cursor:pointer;
  font-size:0.92rem; font-weight:600;
}
.bm-btn-secondary{ background:var(--surface-alt); color:var(--ink); }
.bm-btn-primary{ background:var(--primary); color:white; }
.bm-btn-primary:disabled{ background:var(--line); color:var(--ink-soft); cursor:not-allowed; }

@media (prefers-reduced-motion: reduce){
  .bm-sheet{ animation:none; }
}
</style>
</body>
